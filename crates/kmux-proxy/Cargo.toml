[package]
name = "kmux-proxy"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "tmux control-mode HTTP bridge (runs on the server; the Kindle kmuxd streams through it)"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kmux = { path = "../kmux" }
